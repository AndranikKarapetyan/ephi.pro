<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pointage IDF Nord - 4 juin 2026</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #1e2a3a;
      --muted: #6c7688;
      --line: #dde3ef;
      --brand: #0f4c81;
      --brand-2: #2b7ec1;
      --good: #178f51;
      --bad: #cc3d3d;
      --warn: #ef9c23;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Poppins, Arial, sans-serif;
      background: linear-gradient(160deg, #eaf1fb 0%, #f7fbff 55%, #f5f7fb 100%);
      color: var(--text);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 10px 28px rgba(15, 76, 129, 0.2);
    }

    .hero h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .hero p { margin: 0; opacity: 0.95; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .btn-primary { background: var(--brand); color: #fff; }
    .btn-secondary {
      background: #fff;
      color: var(--brand);
      border: 1px solid var(--line);
    }

    .search-input {
      min-width: 260px;
      max-width: 420px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
    }

    .search-input:focus {
      outline: 2px solid rgba(43, 126, 193, 0.25);
      border-color: var(--brand-2);
    }

    .status-text {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }

    .summary-title {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .summary-value { font-size: 1.6rem; font-weight: 700; }

    .list { display: grid; gap: 12px; }

    .participant {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }

    .participant-head {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .participant-name { margin: 0; font-size: 1.1rem; }

    .participant-meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .checks {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.92rem;
      color: var(--text);
    }

    .companions {
      border-top: 1px dashed var(--line);
      margin-top: 10px;
      padding-top: 10px;
    }

    .companions h4 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .companions-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .companions-head h4 {
      margin: 0;
    }

    .btn-add-companion {
      min-width: 34px;
      height: 34px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--brand);
      font-size: 1.2rem;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add-companion:hover {
      background: #f3f8ff;
      border-color: var(--brand-2);
    }

    .companion-grid { display: grid; gap: 10px; }

    .companion-row {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
      background: #fcfdff;
    }

    .companion-row input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #cfd7e7;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .legend {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: 6px;
    }

    .pill-present { background: #e8f7ef; color: var(--good); }
    .pill-absent { background: #ffefef; color: var(--bad); }
    .pill-unset { background: #fff7e6; color: var(--warn); }

    .empty,
    .error {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .page { padding: 14px; }
      .status-text { width: 100%; margin-left: 0; }
      .companion-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="hero">
      <h1>Pointage cache - Salon IDF Nord (4 juin)</h1>
      <p>Liste complete des inscrits, presence/absence, accompagnateurs et export CSV.</p>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary" id="saveBtn" type="button">Sauvegarder</button>
      <button class="btn btn-secondary" id="csvBtn" type="button">Exporter CSV</button>
      <button class="btn btn-secondary" id="reloadBtn" type="button">Recharger la liste</button>
      <input type="search" id="searchInput" class="search-input" placeholder="Rechercher un client: nom, societe, email, telephone" aria-label="Rechercher un client">
      <div class="status-text" id="statusText">Chargement...</div>
    </div>

    <div class="summary" id="summary"></div>
    <div id="list" class="list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'idf_nord_4juin_attendance_v1';

    const listEl = document.getElementById('list');
    const summaryEl = document.getElementById('summary');
    const statusTextEl = document.getElementById('statusText');
    const saveBtn = document.getElementById('saveBtn');
    const csvBtn = document.getElementById('csvBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const searchInput = document.getElementById('searchInput');

    let registrations = [];
    let state = loadState();
    let searchQuery = '';

    function getToken() {
      const params = new URLSearchParams(window.location.search);
      return (params.get('token') || '').trim();
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      statusTextEl.textContent = `Sauvegarde locale effectuee a ${new Date().toLocaleTimeString('fr-FR')}`;
    }

    function statusBadge(status) {
      if (status === 'present') return '<span class="pill pill-present">Present</span>';
      if (status === 'absent') return '<span class="pill pill-absent">Absent</span>';
      return '<span class="pill pill-unset">Non defini</span>';
    }

    function ensureRecord(registration) {
      const key = registration.id;
      if (!state[key]) {
        state[key] = {
          participantStatus: '',
          companions: []
        };
      }

      const count = Number(registration.companions || 0);
      if (!Array.isArray(state[key].companions)) {
        state[key].companions = [];
      }

      while (state[key].companions.length < count) {
        state[key].companions.push({ firstName: '', lastName: '', status: '' });
      }
    }

    function makeExclusiveCheckboxes(current, other, onUpdate) {
      current.addEventListener('change', () => {
        if (current.checked) {
          other.checked = false;
        }
        onUpdate();
      });

      other.addEventListener('change', () => {
        if (other.checked) {
          current.checked = false;
        }
        onUpdate();
      });
    }

    function computeSummary(visibleRegistrations = registrations) {
      let totalPeople = 0;
      let present = 0;
      let absent = 0;
      let unset = 0;

      visibleRegistrations.forEach((reg) => {
        const rec = state[reg.id] || { participantStatus: '', companions: [] };
        totalPeople += 1;

        if (rec.participantStatus === 'present') present += 1;
        else if (rec.participantStatus === 'absent') absent += 1;
        else unset += 1;

        (rec.companions || []).forEach((comp) => {
          totalPeople += 1;
          if (comp.status === 'present') present += 1;
          else if (comp.status === 'absent') absent += 1;
          else unset += 1;
        });
      });

      summaryEl.innerHTML = `
        <div class="summary-card"><div class="summary-title">Inscriptions</div><div class="summary-value">${visibleRegistrations.length}</div></div>
        <div class="summary-card"><div class="summary-title">Total personnes</div><div class="summary-value">${totalPeople}</div></div>
        <div class="summary-card"><div class="summary-title">Presents</div><div class="summary-value" style="color:var(--good)">${present}</div></div>
        <div class="summary-card"><div class="summary-title">Absents</div><div class="summary-value" style="color:var(--bad)">${absent}</div></div>
        <div class="summary-card"><div class="summary-title">Non definis</div><div class="summary-value" style="color:var(--warn)">${unset}</div></div>
      `;
    }

    function getFilteredRegistrations() {
      const query = searchQuery.trim().toLowerCase();
      if (!query) {
        return registrations;
      }

      return registrations.filter((reg) => {
        const haystack = [
          reg.user_name || '',
          reg.company_name || '',
          reg.user_email || '',
          reg.phone || ''
        ].join(' ').toLowerCase();

        return haystack.includes(query);
      });
    }

    function renderList() {
      const visibleRegistrations = getFilteredRegistrations();

      if (!visibleRegistrations.length) {
        listEl.innerHTML = searchQuery.trim()
          ? '<div class="empty">Aucun client ne correspond a votre recherche.</div>'
          : '<div class="empty">Aucun participant trouve pour IDF Nord - 4 juin.</div>';
        computeSummary(visibleRegistrations);
        return;
      }

      const fragment = document.createDocumentFragment();

      visibleRegistrations.forEach((reg) => {
        ensureRecord(reg);

        const rec = state[reg.id];
        const card = document.createElement('article');
        card.className = 'participant';

        const participantPresentChecked = rec.participantStatus === 'present' ? 'checked' : '';
        const participantAbsentChecked = rec.participantStatus === 'absent' ? 'checked' : '';

        card.innerHTML = `
          <div class="participant-head">
            <div>
              <h3 class="participant-name">${escapeHtml(reg.user_name || 'Participant')}</h3>
              <p class="participant-meta">${escapeHtml(reg.company_name || '')} • ${escapeHtml(reg.user_email || '')} • ${escapeHtml(reg.phone || '')}</p>
              <p class="participant-meta">Accompagnateurs prevus: ${Number(reg.companions || 0)} ${statusBadge(rec.participantStatus)}</p>
            </div>
            <div class="checks" data-role="participant-checks">
              <label class="check"><input type="checkbox" data-role="present" ${participantPresentChecked}> Present</label>
              <label class="check"><input type="checkbox" data-role="absent" ${participantAbsentChecked}> Absent</label>
            </div>
          </div>
        `;

        const participantChecks = card.querySelector('[data-role="participant-checks"]');
        const participantPresent = participantChecks.querySelector('[data-role="present"]');
        const participantAbsent = participantChecks.querySelector('[data-role="absent"]');

        makeExclusiveCheckboxes(participantPresent, participantAbsent, () => {
          if (participantPresent.checked) rec.participantStatus = 'present';
          else if (participantAbsent.checked) rec.participantStatus = 'absent';
          else rec.participantStatus = '';
          computeSummary(getFilteredRegistrations());
        });

        const plannedCompanions = Number(reg.companions || 0);
        const companionsWrap = document.createElement('div');
        companionsWrap.className = 'companions';

        const companionsHead = document.createElement('div');
        companionsHead.className = 'companions-head';
        companionsHead.innerHTML = '<h4>Accompagnateurs</h4>';

        const addCompanionBtn = document.createElement('button');
        addCompanionBtn.type = 'button';
        addCompanionBtn.className = 'btn-add-companion';
        addCompanionBtn.title = 'Ajouter un accompagnateur';
        addCompanionBtn.setAttribute('aria-label', 'Ajouter un accompagnateur');
        addCompanionBtn.textContent = '+';
        addCompanionBtn.addEventListener('click', () => {
          rec.companions.push({ firstName: '', lastName: '', status: '' });
          renderList();
        });

        companionsHead.appendChild(addCompanionBtn);
        companionsWrap.appendChild(companionsHead);

        const grid = document.createElement('div');
        grid.className = 'companion-grid';

        rec.companions.forEach((comp, index) => {
          const row = document.createElement('div');
          row.className = 'companion-row';

          const firstName = document.createElement('input');
          firstName.type = 'text';
          firstName.placeholder = `Prenom accompagnateur ${index + 1}`;
          firstName.value = comp.firstName || '';

          const lastName = document.createElement('input');
          lastName.type = 'text';
          lastName.placeholder = `Nom accompagnateur ${index + 1}`;
          lastName.value = comp.lastName || '';

          const checks = document.createElement('div');
          checks.className = 'checks';
          checks.innerHTML = `
            <label class="check"><input type="checkbox" data-role="present" ${comp.status === 'present' ? 'checked' : ''}> Present</label>
            <label class="check"><input type="checkbox" data-role="absent" ${comp.status === 'absent' ? 'checked' : ''}> Absent</label>
          `;

          const presentCb = checks.querySelector('[data-role="present"]');
          const absentCb = checks.querySelector('[data-role="absent"]');

          firstName.addEventListener('input', () => {
            comp.firstName = firstName.value;
          });

          lastName.addEventListener('input', () => {
            comp.lastName = lastName.value;
          });

          makeExclusiveCheckboxes(presentCb, absentCb, () => {
            if (presentCb.checked) comp.status = 'present';
            else if (absentCb.checked) comp.status = 'absent';
            else comp.status = '';
            computeSummary(getFilteredRegistrations());
          });

          row.appendChild(firstName);
          row.appendChild(lastName);
          row.appendChild(checks);
          grid.appendChild(row);
        });

        companionsWrap.appendChild(grid);
        const legend = document.createElement('p');
        legend.className = 'legend';
        legend.textContent = `Prevus: ${plannedCompanions} • Saisis: ${rec.companions.length}. Utilisez + pour ajouter un accompagnateur supplementaire.`;
        companionsWrap.appendChild(legend);

        card.appendChild(companionsWrap);

        fragment.appendChild(card);
      });

      listEl.innerHTML = '';
      listEl.appendChild(fragment);
      computeSummary(visibleRegistrations);
    }

    function toCsvValue(value) {
      const safe = String(value ?? '').replace(/"/g, '""');
      return `"${safe}"`;
    }

    function exportCsv() {
      const rows = [
        [
          'Type',
          'Nom',
          'Prenom',
          'Nom complet',
          'Entreprise/Commune',
          'Email',
          'Telephone',
          'Statut',
          'Date salon',
          'Lieu salon'
        ]
      ];

      registrations.forEach((reg) => {
        const rec = state[reg.id] || { participantStatus: '', companions: [] };

        rows.push([
          'Participant',
          '',
          '',
          reg.user_name || '',
          reg.company_name || '',
          reg.user_email || '',
          reg.phone || '',
          rec.participantStatus || 'non_defini',
          reg.event_date || '4 juin 2026',
          reg.event_location || 'IDF nord (95)'
        ]);

        (rec.companions || []).forEach((comp) => {
          rows.push([
            'Accompagnateur',
            comp.lastName || '',
            comp.firstName || '',
            `${(comp.firstName || '').trim()} ${(comp.lastName || '').trim()}`.trim(),
            reg.company_name || '',
            '',
            '',
            comp.status || 'non_defini',
            reg.event_date || '4 juin 2026',
            reg.event_location || 'IDF nord (95)'
          ]);
        });
      });

      const csv = rows.map((row) => row.map(toCsvValue).join(';')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `pointage_idf_nord_4juin_${new Date().toISOString().slice(0, 10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      statusTextEl.textContent = 'CSV genere avec succes.';
    }

    async function loadRegistrations() {
      listEl.innerHTML = '<div class="empty">Chargement des participants...</div>';
      statusTextEl.textContent = 'Connexion aux donnees...';

      try {
        const token = getToken();
        if (!token) {
          throw new Error('token manquant dans le lien');
        }

        const response = await fetch(`/api/idf-nord-attendance?token=${encodeURIComponent(token)}`);
        const payload = await response.json();

        if (!response.ok) {
          throw new Error(payload.message || payload.error || 'Erreur de chargement');
        }

        registrations = Array.isArray(payload.registrations) ? payload.registrations : [];
        renderList();

        statusTextEl.textContent = `${registrations.length} inscription(s) chargee(s).`;
      } catch (error) {
        listEl.innerHTML = `<div class="error">Impossible de charger la liste: ${escapeHtml(error.message)}</div>`;
        summaryEl.innerHTML = '';
        statusTextEl.textContent = 'Erreur de chargement.';
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    saveBtn.addEventListener('click', saveState);
    csvBtn.addEventListener('click', () => {
      saveState();
      exportCsv();
    });
    reloadBtn.addEventListener('click', loadRegistrations);
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      renderList();
    });

    loadRegistrations();
  </script>
</body>
</html>
